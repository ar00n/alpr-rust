version: '3.8'

services:
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-server
    environment:
      - MTX_RTSPTRANSPORTS=tcp
    ports:
      - "8554:8554"
      - "8000:8000/udp" # RTP
      - "8001:8001/udp" # RTCP
      - "8888:8888" # HTTP
      - "8889:8889" # WebRTC

  ffmpeg-slideshow:
    image: linuxserver/ffmpeg:latest
    container_name: ffmpeg-slideshow
    depends_on:
      - rtsp-server
    volumes:
      - ./images:/images:ro
    entrypoint:
      - sh
      - -c
      - |
        sleep 2
        while true; do
          ffmpeg -re -loop 1 -framerate 1/3 -pattern_type glob -i '/images/*.jpg' -c:v libx264 -preset veryfast -tune zerolatency -r 10 -pix_fmt yuv420p -g 10 -pkt_size 1300 -rtsp_transport tcp -f rtsp rtsp://rtsp-server:8554/mystream
          sleep 1
        done
    restart: always
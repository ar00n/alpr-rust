server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Support for Single Page Application client-side routing
        try_files $uri $uri/ /index.html;
    }

    location /api/ws {
        proxy_pass http://backend:3000;

        # WebSocket specific headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API requests to the Rust backend container
    location /api/ {
        # Depending on if your Rust routes include "/api", you may need to rewrite the URL.
        # If your Rust route is literally just "/users", uncomment the rewrite line below:
        # rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}